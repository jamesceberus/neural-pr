name: Core unit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run synthetic verifier and controller checks
        run: >-
          python -m unittest
          tests.test_action_protocol tests.test_controller
          tests.test_evaluator_improver tests.test_transport
          tests.test_sandbox_worker tests.test_policy_followup
          tests.test_wonder_learning tests.test_publish_github -v
