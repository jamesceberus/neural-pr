[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-pr"
version = "0.1.0"
description = "A coding runner with evidence-gated, versioned operating procedures"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
neural-pr = "neural_pr.cli:main"

[tool.setuptools.packages.find]
include = ["neural_pr*", "whisper_repair*", "research_eval*", "ui*"]

[tool.setuptools.package-data]
neural_pr = ["templates/**/*", "web/*"]
ui = ["static/*", "agent_profile.json"]
